name: "engineering-manager"
version: "1.0.0"
description: "Tier 3 Engineering Manager: WBS compilation, DAG resolution, and ticket dispatch"

plugins:
  - name: "dsh-model-litellm"
    config:
      endpoint: "http://litellm-proxy:4000/v1"
      model: "secondary/burst"
      api_key: "${LITELLM_MASTER_KEY}"
      temperature: 0.1

  - name: "dsh-a2a"
    config:
      server: true
      port: 8088
      card:
        name: "engineering-manager-agent"
        description: "Compiles WBS, schedules DAGs, and manages Kanban state"
        skills:
          - id: "plan-sprint"
            name: "Sprint Planning & DAG Scheduling"
            inputModes: ["application/json"]
            outputModes: ["application/json"]

  - name: "dsh-trajectory"
    config:
      output_dir: "/trajectories/engineering-manager"
      format: "jsonl"
      record_tokens: true
