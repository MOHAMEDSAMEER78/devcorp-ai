[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devcorp-ai"
version = "0.1.0"
description = "Autonomous Multi-Agent Software Organization Platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "litellm>=1.40.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.18",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
demo = [
    "playwright>=1.44.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/core", "packages/orchestrator", "packages/gateway"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = []
