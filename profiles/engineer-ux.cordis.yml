name: "engineer-ux"
version: "1.0.0"
description: "Tier 4 UX Engineer: Design system implementation, a11y compliance, and animations"

plugins:
  - name: "dsh-model-litellm"
    config:
      endpoint: "http://litellm-proxy:4000/v1"
      model: "primary/reasoning"
      api_key: "${LITELLM_MASTER_KEY}"
      temperature: 0.1

  - name: "dsh-mcp"
    config:
      servers:
        - name: "filesystem"
          transport: "stdio"
          command: "python3"
          args: ["-m", "packages.mcp_servers.filesystem_server", "--root", "/workspace"]
        - name: "terminal"
          transport: "stdio"
          command: "python3"
          args: ["-m", "packages.mcp_servers.terminal_server"]

  - name: "dsh-a2a"
    config:
      server: true
      port: 8091
      card:
        name: "ux-engineer-agent"
        description: "Implements design systems and accessibility features"
        skills:
          - id: "implement-ux-ticket"
            name: "UX Implementation"
            inputModes: ["application/json"]
            outputModes: ["application/json", "text/plain"]

  - name: "dsh-sandbox"
    config:
      mode: "standard"
      image: "devcorp/agent-sandbox:latest"
      timeout_seconds: 1800

  - name: "dsh-trajectory"
    config:
      output_dir: "/trajectories/ux-engineer"
      format: "jsonl"
      record_tokens: true
